<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Tasks - TaskForge</title>
    <link rel="stylesheet" href="tasks.css">
</head>
<body>

<div class="dashboard-container">

<div class="sidebar">
<h2>⚡ TaskForge</h2>

<ul>
<li><a href="dashboard.html">Dashboard</a></li>

<li><a href="projects.html">Projects</a></li>

<li class="active">
    <a href="tasks.html">Tasks</a>
</li>
<li><a href="mentors.html">Mentors</a></li>
<li><a href="files.html">Files</a></li>
<li><a href="settings.html">Settings</a></li>
</ul>

</div>

<div class="main-content">

<div class="page-header">

    <div>
        <h1>Tasks</h1>

        <p class="page-subtitle">
            Manage and track all your tasks.
        </p>
    </div>

    <button class="new-project-btn" onclick="addTask()">
        + New Task
    </button>

</div>

<div class="task-stats">

    <div class="stat-box">
        Total Tasks:
        <span id="total-tasks">0</span>
    </div>

    <div class="stat-box">
        Completed:
        <span id="completed-tasks">0</span>
    </div>

    <div class="stat-box">
        Pending:
        <span id="pending-tasks">0</span>
    </div>
</div>

<div class="filter-buttons">

    <button onclick="showAllTasks()">
        All
    </button>

    <button onclick="showCompletedTasks()">
        Completed
    </button>

    <button onclick="showPendingTasks()">
        Pending
    </button>

</div>
<div class="projects-grid" id="tasks-container">

</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
